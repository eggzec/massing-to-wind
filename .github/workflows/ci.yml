# CI (D-045): validate + determinism on Linux and Windows, then a cross-OS comparison of repaired.obj hashes.
# Actions are pinned to full commit SHAs (tag in the comment). Update by looking up the new tag's commit.
name: ci
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  # check-locks.sh: in CI a missing lock-v0.1 tag is a FAIL, not a skip (D-046).
  M2W_REQUIRE_LOCK_TAG: "1"

jobs:
  validate:
    name: validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false          # always get both OSes' results and hashes
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          fetch-depth: 0        # full history and tags: check-locks.sh diffs against lock-v0.1
          fetch-tags: true

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73   # v6.1.0
        with:
          dotnet-version: "8.0.x"

      - name: NuGet cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.props', '**/Directory.Packages.props', '**/global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Validate (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          chmod +x scripts/*.sh
          scripts/validate.sh

      - name: Validate (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/validate.ps1

      # The determinism steps also run when validate failed, so a red run still shows whether output is stable.
      - name: Determinism (Linux)
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        shell: bash
        run: bash scripts/determinism.sh

      - name: Determinism (Windows)
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        shell: pwsh
        run: ./scripts/determinism.ps1

      - name: Upload repaired.obj hashes
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: hashes-${{ runner.os }}
          path: out/hashes.txt
          if-no-files-found: error
          retention-days: 30

  cross-os:
    name: cross-OS determinism (Linux vs Windows)
    needs: validate
    if: ${{ !cancelled() }}     # compare whatever hashes exist even if a validate job failed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333   # v8.0.2
        with:
          pattern: hashes-*
          path: hashes

      - name: Compare repaired.obj hashes
        shell: bash
        run: |
          set -euo pipefail
          lin=hashes/hashes-Linux/hashes.txt
          win=hashes/hashes-Windows/hashes.txt
          for f in "$lin" "$win"; do
            [ -s "$f" ] || { echo "::error::missing or empty $f (its validate job stopped before the determinism step)"; exit 1; }
          done
          if cmp -s "$lin" "$win"; then
            msg="cross-os: OK, $(wc -l < "$lin") cases, repaired.obj byte-identical on Linux and Windows"
            echo "$msg"; echo "$msg" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::error::repaired.obj differs between Linux and Windows"
          echo "cases that differ (sha256 per OS):"
          LC_ALL=C join -a1 -a2 -e MISSING -o 0,1.2,2.2 "$lin" "$win" \
            | awk '$2 != $3 { n++; print "  " $1 "  linux=" $2 "  windows=" $3 } END { print n + 0 " case(s) differ" }' \
            | tee -a "$GITHUB_STEP_SUMMARY"
          cmp "$lin" "$win" || true
          exit 1
